<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Tài liệu hội nghị 2026–2027">
  <title>Tài liệu hội nghị 2026–2027</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #000000;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 32px 24px;
      padding-top: max(32px, env(safe-area-inset-top));
      padding-bottom: max(32px, env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
    }

    .title {
      font-size: 32px;
      font-weight: 700;
      line-height: 1.2;
      color: #000000;
      letter-spacing: -0.5px;
      margin-bottom: 24px;
    }

    .subtitle {
      font-size: 21px;
      font-weight: 400;
      color: #000000;
      margin-bottom: 20px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .btn {
      display: block;
      width: 100%;
      background-color: #efeffe;
      border-radius: 12px;
      padding: 16px 20px;
      text-decoration: underline;
      text-underline-offset: 4px;
      color: #1d386a;
      font-size: 18.5px;
      font-weight: 500;
      text-align: left;
      line-height: 1.4;
      cursor: pointer;
      border: none;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.15s ease, opacity 0.15s ease;
    }

    .btn:active {
      opacity: 0.75;
      background-color: #e5e5fa;
    }

    .btn:hover {
      background-color: #e8e8fc;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1 class="title">Tài liệu hội nghị<br>2026–2027</h1>

    <p class="subtitle">Chọn nội dung:</p>

    <div class="btn-group">
      <a href="http://fphhcm.edu.vn/bao-cao-tong-ket-nam-hoc/" class="btn" target="_blank" rel="noopener noreferrer">
        1. Báo cáo tổng kết năm học
      </a>

      <a href="https://drive.google.com/file/d/1UUFp_MAQClSWqIdIeDgOJEvAWpBoKu_Y/view?usp=drive_link" class="btn" target="_blank" rel="noopener noreferrer">
        2. Báo cáo công đoàn (PDF)
      </a>
    </div>
  </main>
</body>
</html>
